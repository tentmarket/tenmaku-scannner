<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天幕在庫管理 QRスキャナー</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; margin: 16px;
         color: #222; background: #fff; max-width: 560px; font-size: 17px; }
  h1 { font-size: 22px; margin: 4px 0 10px; }
  button { font-size: 18px; padding: 14px 18px; margin: 6px 0; width: 100%; border-radius: 12px;
           border: 1px solid #999; background: #fff; cursor: pointer; }
  button.main { background: #1f6fd1; color: #fff; border-color: #1f6fd1; font-weight: bold; }
  button:disabled { opacity: 0.45; cursor: default; }
  video { width: 100%; background: #000; border-radius: 10px; border: 4px solid #000; box-sizing: border-box; }
  video.ok { border-color: #2e9e4f; }
  video.ng { border-color: #d33a3a; }
  .box { padding: 10px 12px; border: 1px solid #bbb; border-radius: 10px; margin: 8px 0; word-break: break-all; }
  #status { font-weight: bold; }
  #status.err { color: #c00; }
  ul { list-style: none; padding: 0; margin: 6px 0; max-height: 260px; overflow-y: auto; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid #eee;
       padding: 6px 2px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
  li button { width: auto; font-size: 14px; padding: 6px 10px; margin: 0; border-radius: 8px; }
  .small { font-size: 14px; color: #666; }
</style>
</head>
<body>
<h1 id="title">QRスキャナー</h1>
<div class="small" id="modeInfo"></div>

<button class="main" id="startBtn">① カメラを起動</button>
<div class="box" id="status">待機中</div>
<video id="video" playsinline muted></video>
<canvas id="canvas" hidden></canvas>

<label><input type="checkbox" id="soundChk" checked> 確認音を鳴らす</label>
<div class="box">読み取り数：<span id="count">0</span> 枚</div>
<ul id="list"></ul>

<button class="main" id="sendBtn">② 読み取った内容をアプリに送る</button>
<button id="clearBtn">リストをクリア</button>
<button id="backBtn">読み取らずにアプリに戻る</button>

<script src="vendor/jsQR.js"></script>
<script>
(function () {
  // ここを、本番のGASアプリのURL（/execで終わるもの）に書き換える
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz5uaoRlvg1R72SQ2Z3jmeiokUxt3Jgl9lNHskFfl9OsWYto9ULQD45xUh5fmRrZBA/exec';

  // どの用途で開かれたか（アプリからの引き渡し：?mode=out は出庫、?mode=reprint はラベル再印刷）
  var m = /[?&]mode=(out|reprint)(?:&|$)/.exec(location.search || '');
  var MODE = m ? m[1] : '';
  var MODES = {
    out:     { title: 'QRスキャナー（出庫）',        send: '② 出庫リストに追加する', info: '読み取ったラベルを、アプリの出庫予定リストに追加します。' },
    reprint: { title: 'QRスキャナー（ラベル再印刷）', send: '② 印刷リストに追加する', info: '読み取ったラベルを、アプリの印刷リストに追加します。' },
    '':      { title: 'QRスキャナー',                send: '② 読み取った内容をアプリに送る', info: '' }
  };
  var CFG = MODES[MODE];
  var MAX = 2000;
  var STORE_KEY = 'tenmaku_scan_list_' + (MODE || 'none');

  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');

  document.getElementById('title').textContent = CFG.title;
  document.getElementById('modeInfo').textContent = CFG.info;
  document.getElementById('sendBtn').textContent = CFG.send;
  document.title = '天幕在庫管理 ' + CFG.title;

  var found = [];          // 読み取り済みの個体ID（重複なし）
  var audioCtx = null;
  var lastText = '', lastTime = 0, scanning = false, flashTimer = null;

  function setStatus(text, isErr) { statusEl.textContent = text; statusEl.className = isErr ? 'err' : ''; }
  function flash(cls) {
    video.className = cls;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { video.className = ''; }, 400);
  }
    // ----- 確認音（数字を変えると、音の高さ・長さを調整できます） -----
  var SOUND = {
    okFreq: 2000, okMs: 90, okVol: 0.5,                   // 成功：高くて短い「ピッ」
    ngFreq: 350, ngVol: 0.3, ngPattern: [[0, 130], [190, 130]]   // 警告：「ブブーッ」（開始位置と長さ、ミリ秒）
  };
  function tone(freq, delayMs, durMs, type, vol) {
    var t0 = audioCtx.currentTime + delayMs / 1000, t1 = t0 + durMs / 1000;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
    g.gain.setValueAtTime(vol, Math.max(t0 + 0.006, t1 - 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t1);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t1 + 0.02);
  }
  // 呼び出し側は変えません：高い音（800以上）＝成功の「ピッ」、それ以外＝警告の「ブブーッ」
  function beep(freq) {
    if (!document.getElementById('soundChk').checked || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (freq >= 800) {
        tone(SOUND.okFreq, 0, SOUND.okMs, 'sine', SOUND.okVol);
      } else {
        SOUND.ngPattern.forEach(function (p) { tone(SOUND.ngFreq, p[0], p[1], 'square', SOUND.ngVol); });
      }
    } catch (e) { /* 音が出せなくても、読み取りは続ける */ }
  }



  // ---------- 読み取り済みリストの保存（画面を更新しても消えないように） ----------
  function save() { try { window.sessionStorage.setItem(STORE_KEY, JSON.stringify(found)); } catch (e) { /* 何もしない */ } }
  function restore() {
    try {
      var a = JSON.parse(window.sessionStorage.getItem(STORE_KEY) || '[]');
      if (Array.isArray(a)) a.forEach(function (s) { if (typeof s === 'string' && /^[0-9a-fA-F-]{32,40}$/.test(s) && found.indexOf(s) < 0) found.push(s); });
    } catch (e) { /* 何もしない */ }
  }
  function render() {
    listEl.innerHTML = '';
    found.forEach(function (id, i) {
      var li = document.createElement('li');
      var t = document.createElement('span');
      t.textContent = (i + 1) + '. ' + id.slice(0, 8) + '…' + id.slice(-4);
      var b = document.createElement('button');
      b.textContent = '取消';
      b.onclick = function () { found.splice(i, 1); save(); render(); };
      li.appendChild(t); li.appendChild(b);
      listEl.appendChild(li);
    });
    countEl.textContent = found.length;
  }

  // ---------- カメラ ----------
  document.getElementById('startBtn').onclick = async function () {
    if (typeof jsQR === 'undefined') {
      setStatus('エラー：QR読み取りの部品（vendor/jsQR.js）が読み込めていません', true);
      return;
    }
    try {
      // 音は、画面を押した操作の中で準備する必要がある（iPhoneの制限）
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = stream;
      await video.play();
      setStatus('カメラ起動中。QRコードを映してください。', false);
      if (!scanning) { scanning = true; requestAnimationFrame(tick); }
    } catch (e) {
      setStatus('失敗：' + e.name + ' / ' + e.message, true);
    }
  };

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) onRead(code.data);
    }
    setTimeout(function () { requestAnimationFrame(tick); }, 120);
  }

  function onRead(text) {
    var now = Date.now();
    // 同じQRを映し続けても、連続で反応しないようにする
    if (text === lastText && now - lastTime < 2000) { lastTime = now; return; }
    lastText = text; lastTime = now;

    if (!/^[0-9a-fA-F-]{32,40}$/.test(text)) {          // 天幕在庫管理のラベル以外
      setStatus('このQRは、ラベルのものではありません', true);
      flash('ng'); beep(300, 250);
      return;
    }
    if (found.indexOf(text) >= 0) {
      setStatus('読み取り済みです（重複）', true);
      flash('ng'); beep(300, 250);
      return;
    }
    if (found.length >= MAX) {
      setStatus('一度に読み取れるのは' + MAX + '枚までです。いったん、アプリに送ってください', true);
      flash('ng'); beep(300, 250);
      return;
    }
    found.push(text);
    save();
    render();
    setStatus('読み取り成功（' + found.length + '枚目）', false);
    flash('ok'); beep(880, 120);
  }

  // ---------- アプリへ戻る（同じタブで移動） ----------
  function gasUrl(withScan) {
    var url = GAS_URL + '?mode=' + MODE;
    if (withScan && found.length > 0) url += '&scan=' + encodeURIComponent(found.join(','));
    return url;
  }
  function stopCamera() {
    try { if (video.srcObject) video.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* 何もしない */ }
  }
  document.getElementById('sendBtn').onclick = function () {
    if (found.length === 0) { setStatus('まだ読み取っていません', true); return; }
    if (GAS_URL.indexOf('https://') !== 0) { setStatus('エラー：GAS_URL が設定されていません', true); return; }
    stopCamera();
    try { window.sessionStorage.removeItem(STORE_KEY); } catch (e) { /* 何もしない */ }
    location.href = gasUrl(true);
  };
  document.getElementById('backBtn').onclick = function () {
    if (GAS_URL.indexOf('https://') !== 0) { setStatus('エラー：GAS_URL が設定されていません', true); return; }
    stopCamera();
    location.href = gasUrl(false);
  };
  document.getElementById('clearBtn').onclick = function () {
    found.length = 0; save(); render(); lastText = '';
    setStatus('クリアしました', false);
  };

  restore();
  render();
  window.__scan = { onRead: onRead, found: found, gasUrl: gasUrl };   // 動作確認用
})();
</script>
</body>
</html>
