<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラベルPDFテスト（エーワン28176）</title>
<style>
  body { font-family: sans-serif; margin: 16px; color: #222; background: #fff; max-width: 640px; }
  label { display: block; margin: 8px 0; }
  input[type=number] { font-size: 18px; width: 90px; padding: 6px; }
  button { font-size: 18px; padding: 14px 20px; margin: 10px 0; width: 100%; }
  .box { padding: 10px; border: 1px solid #999; margin: 8px 0; }
</style>
</head>
<body>
<h2>ラベルPDFテスト（エーワン28176）</h2>

<label>印刷開始位置（1〜12）：<input id="startPos" type="number" min="1" max="12" value="1"></label>
<label>印刷枚数：<input id="count" type="number" min="1" max="60" value="20"></label>
<label>左右の調整(mm、右へ＋2)：<input id="offX" type="number" step="0.1" value="0"></label>
<label>上下の調整(mm、下へ＋)：<input id="offY" type="number" step="0.1" value="0"></label>
<label><input id="frame" type="checkbox" checked> ラベルの枠線も印刷する（普通紙テスト用）</label>

<button id="go">PDFを作成して開く</button>
<div class="box" id="msg">待機中</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ===== エーワン28176の寸法（公式テンプレートZT28176_Aから実測、単位mm） =====
const LW = 83.8;    // ラベル幅
const LH = 42.3;    // ラベル高さ
const X0 = 20.3;    // 左端のラベルの左位置
const Y0 = 20.0;    // 1段目のラベルの上位置
const PX = 87.6;    // 列の間隔（左ラベルの左端→右ラベルの左端）
const PY = 42.3;    // 段の間隔

// ===== カラー一覧（名前と表示色。表示色は試作用の近似色） =====
const COLORS = {
  WH: ['ホワイト',       '#FFFFFF'],
  RO: ['ロイヤルブルー', '#1A47B8'],
  GN: ['グリーン',       '#1E8A3C'],
  BE: ['ベージュ',       '#D9C3A0'],
  SK: ['スキンベージュ', '#E8B89A'],
  GR: ['グレー',         '#8A8D91'],
  YE: ['イエロー',       '#F2C200'],
  OR: ['オレンジ',       '#F28C00'],
  RE: ['レッド',         '#D01F2A'],
  PI: ['ピンク',         '#F06EA9'],
  BW: ['ブラウン',       '#6B4226'],
  BU: ['バーガンディ',   '#7A1530'],
  PU: ['パープル',       '#6A3FA0'],
  LI: ['ライムグリーン', '#8CC63F'],
  SB: ['スカイブルー',   '#3FA9E0'],
  NA: ['ネイビー',       '#1B2A55'],
  BL: ['ブラック',       '#111111']
};

// ===== テスト用サンプルデータ（17色をサイズ4種に割り当てて順に出す） =====
const SIZES = [
  { size: '3m×6m',     code: '3x6' },
  { size: '3m×3m',     code: '3x3' },
  { size: '3.6m×7.2m', code: 'HG-3.6x7.2' },
  { size: '4m×8m',     code: '4x8' }
];
const PRODUCTS = Object.keys(COLORS).map(function (cc, i) {
  const s = SIZES[i % SIZES.length];
  return { size: s.size, code: s.code, cc: cc };
});
function makeSample(i) {
  const p = PRODUCTS[i % PRODUCTS.length];
  const serial = String(Math.floor(i / PRODUCTS.length) + 1).padStart(3, '0');
  return {
    size: p.size,
    color: COLORS[p.cc][0],
    hex: COLORS[p.cc][1],
    date: '2026/11/04',
    no: p.code + '-' + p.cc + '-20261104-' + serial,
    id: (crypto.randomUUID ? crypto.randomUUID() : 'TEST-' + i + '-' + Date.now())
  };
}

// 明るい色かどうか（明るい色には黒い縁取りを付ける）
function isLight(hex) {
  const r = parseInt(hex.substr(1, 2), 16);
  const g = parseInt(hex.substr(3, 2), 16);
  const b = parseInt(hex.substr(5, 2), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5;
}

// 文字部分を画像にする（日本語フォントを同梱せずに試すため）
function textImage(lb) {
  const S = 16, w = 42, h = 36;   // 1mmあたり16px
  const c = document.createElement('canvas');
  c.width = w * S; c.height = h * S;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.textBaseline = 'top';
  const fam = '"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
  const font = (mm, bold) => (bold ? 'bold ' : '') + Math.round(mm * S) + 'px ' + fam;

  // color：文字色、outline：黒い縁取りを付けるか
  function draw(text, mm, bold, y, color, outline) {
    let s = mm; g.font = font(s, bold);
    const pad = outline ? 0.5 : 0;           // 縁取り分の余白(mm)
    while (g.measureText(text).width > (w - pad * 2) * S && s > 1.5) {
      s -= 0.1; g.font = font(s, bold);
    }
    const x = pad * S;
    if (outline) {
      g.lineJoin = 'round';
      g.lineWidth = 0.5 * S;                 // 縁取りの太さ（外側に約0.25mm）
      g.strokeStyle = '#000';
      g.strokeText(text, x, y * S);
    }
    g.fillStyle = color;
    g.fillText(text, x, y * S);
    return s;
  }

  let y = 3;
  y += draw(lb.size, 8, true, y, '#000', false) * 1.3;
  y += draw(lb.color, 6.5, true, y, lb.hex, isLight(lb.hex)) * 1.4;
  y += draw('入庫日 ' + lb.date, 4, false, y, '#000', false) * 1.7;
  draw(lb.no, 3.4, false, y, '#000', false);
  return c.toDataURL('image/png');
}

function drawLabel(doc, x, y, lb, withFrame) {
  if (withFrame) {
    doc.setDrawColor(150); doc.setLineWidth(0.1);
    doc.roundedRect(x, y, LW, LH, 2, 2, 'S');
  }
  // QRコード（ベクターで描画。QRの周囲は白い余白）
  const qr = qrcode(0, 'M');
  qr.addData(lb.id); qr.make();
  const n = qr.getModuleCount();
  const qrSize = 30, m = qrSize / n;
  const qx = x + 5, qy = y + (LH - qrSize) / 2;
  doc.setFillColor(0, 0, 0);
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) doc.rect(qx + c * m, qy + r * m, m + 0.02, m + 0.02, 'F');
    }
  }
  // 右側の文字
  doc.addImage(textImage(lb), 'PNG', x + 38, y + 3.15, 42, 36, undefined, 'FAST');
}

document.getElementById('go').onclick = function () {
  const msg = document.getElementById('msg');
  try {
    const startPos = Math.min(12, Math.max(1, parseInt(document.getElementById('startPos').value, 10) || 1));
    const count = Math.max(1, parseInt(document.getElementById('count').value, 10) || 1);
    const offX = parseFloat(document.getElementById('offX').value) || 0;
    const offY = parseFloat(document.getElementById('offY').value) || 0;
    const withFrame = document.getElementById('frame').checked;

    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    let slot = startPos - 1;    // 0〜11
    let pages = 1;
    for (let i = 0; i < count; i++) {
      if (slot >= 12) { doc.addPage(); slot = 0; pages++; }   // 2ページ目以降は必ず1番から
      const col = slot % 2, row = Math.floor(slot / 2);
      drawLabel(doc, X0 + col * PX + offX, Y0 + row * PY + offY, makeSample(i), withFrame);
      slot++;
    }
    msg.textContent = 'PDFを作成しました（' + count + '枚 / ' + pages + 'ページ）';
    const url = doc.output('bloburl');
    if (!window.open(url, '_blank')) { location.href = url; }
  } catch (e) {
    msg.textContent = 'エラー：' + e.message;
  }
};
</script>
</body>
</html>
